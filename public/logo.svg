<svg width="240" height="60" viewBox="0 0 240 60" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="valenGradSvg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="100%" stop-color="#00d094" />
    </linearGradient>
    <linearGradient id="valenGradDarkSvg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#00d094" stop-opacity="0.7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Monogram Box -->
  <g transform="translate(10, 6)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#0b1219" stroke="url(#valenGradSvg)" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- V Left -->
    <path d="M 12 13 L 24 37 L 17 37 L 8 13 Z" fill="url(#valenGradSvg)" filter="url(#glow)" />
    <!-- I Pillar -->
    <path d="M 22.5 13 H 25.5 V 30 H 22.5 Z" fill="url(#valenGradDarkSvg)" />
    <!-- V Right -->
    <path d="M 36 13 L 24 37 L 31 37 L 40 13 Z" fill="url(#valenGradSvg)" filter="url(#glow)" />
    <!-- Dot -->
    <circle cx="24" cy="9" r="2.5" fill="#38ef7d" />
  </g>

  <!-- Typography -->
  <text x="72" y="38" font-family="Montserrat, Inter, system-ui, sans-serif" font-size="26" font-weight="800" letter-spacing="2" fill="#ffffff">VALEN</text>
  <text x="175" y="38" font-family="Montserrat, Inter, system-ui, sans-serif" font-size="26" font-weight="300" letter-spacing="3" fill="#00d094">INFO</text>
</svg>
